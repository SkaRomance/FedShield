name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancella run precedenti su stesso branch/PR (risparmia minuti CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.29.2"

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      DATABASE_URL: "file:./prisma/dev.db"
      JWT_SECRET: "ci-test-jwt-secret-not-used-in-production"
      FEDSHIELD_N8N_API_KEY: "ci-test-n8n-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Cache Prisma engines (~50MB). Invalidato a schema change o version bump.
      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/prisma
            node_modules/.pnpm/@prisma+engines*
          key: ${{ runner.os }}-prisma-${{ hashFiles('apps/backend/prisma/schema.prisma', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @fedshield/backend db:generate

      - name: Prisma db push (apply schema to fresh SQLite)
        run: pnpm --filter @fedshield/backend db:push

      # Type-check PRIMA dei test: i test girano via tsx (transpile-only,
      # senza type checking) → un errore di tipo passerebbe inosservato.
      - name: TypeScript check (backend)
        run: pnpm --filter @fedshield/backend exec tsc --noEmit -p tsconfig.json

      - name: Run backend tests
        run: pnpm --filter @fedshield/backend test

  test-desktop:
    name: Test Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Skip Electron binary (~150MB): test desktop usa solo jsdom + vite,
      # non avvia il main process.
      - name: Install dependencies (skip Electron binary)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Run desktop tests
        run: pnpm --filter @fedshield/desktop test

      - name: TypeScript check (desktop)
        run: pnpm --filter @fedshield/desktop exec tsc --noEmit -p tsconfig.json

      - name: Build desktop (vite)
        run: pnpm --filter @fedshield/desktop build

      - name: Upload desktop build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build-${{ github.sha }}
          path: apps/desktop/dist
          retention-days: 7
          if-no-files-found: ignore
